name: monitor

on:
  schedule:
    - cron: "3-59/5 * * * *"   # проверка каждые 5 минут (GitHub иногда задерживает на 5-15 минут)
    - cron: "17 7 1 * *"       # отчёт за прошлый месяц: 1-го числа, ~09:17 по Киеву
  workflow_dispatch:
    inputs:
      mode:
        description: "check - проверка, test - тест Telegram, diag - диагностика, report - отчёт"
        default: "check"
        type: choice
        options: [check, cmd, help, setup, probe, peek, test, diag, report, tokenwarn, webhook, webhook-off]

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DEYE_APP_ID: ${{ secrets.DEYE_APP_ID }}
      DEYE_APP_SECRET: ${{ secrets.DEYE_APP_SECRET }}
      DEYE_EMAIL: ${{ secrets.DEYE_EMAIL }}
      DEYE_PASSWORD: ${{ secrets.DEYE_PASSWORD }}
      DEYE_COMPANY_ID: ${{ secrets.DEYE_COMPANY_ID }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      STATIONS_JSON: ${{ secrets.STATIONS_JSON }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      INBOX_KEY: ${{ secrets.INBOX_KEY }}
      LOW_SOC: ${{ vars.LOW_SOC }}
      STALE_MIN: ${{ vars.STALE_MIN }}
      STATE_FILE: /tmp/solaris-state.json
    steps:
      - uses: actions/checkout@v4

      - name: Проверка секретов
        run: |
          for k in DEYE_APP_ID DEYE_APP_SECRET DEYE_EMAIL DEYE_PASSWORD TELEGRAM_TOKEN TELEGRAM_CHAT_ID STATE_KEY; do
            if [ -z "${!k}" ]; then echo "Не заполнен секрет $k"; missing=1; fi
          done
          if [ -n "$missing" ]; then exit 1; fi

      - name: Достать свежую память из кэша
        uses: actions/cache/restore@v4
        with:
          path: /tmp/solaris-cache
          key: state-none
          restore-keys: |
            state-

      - name: Расшифровать состояние
        run: |
          SRC=state.enc
          if [ -f /tmp/solaris-cache/state.enc ]; then SRC=/tmp/solaris-cache/state.enc; fi
          if [ -f "$SRC" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:STATE_KEY -in "$SRC" -out "$STATE_FILE" || {
              echo "память из кэша не расшифровалась, берём из репозитория"
              if [ -f state.enc ]; then openssl enc -d -aes-256-cbc -pbkdf2 -pass env:STATE_KEY -in state.enc -out "$STATE_FILE" || echo "начинаем с чистого"; fi
            }
          fi

      - name: Запуск
        run: |
          pip install -q requests
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event.schedule }}" = "17 7 1 * *" ]; then MODE=report; fi
          python monitor.py "${MODE:-check}"

      - name: Зашифровать память
        if: always()
        run: |
          mkdir -p /tmp/solaris-cache
          if [ -f "$STATE_FILE" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:STATE_KEY -in "$STATE_FILE" -out /tmp/solaris-cache/state.enc
          fi
          # режим peek: отчёт для Claude. Случайный ключ шифрует отчёт, сам ключ - открытым ключом claude_pub.pem
          if [ -f "$STATE_FILE.peek" ] && [ -f claude_pub.pem ]; then
            mkdir -p /tmp/peek
            openssl rand -hex 32 > /tmp/peek.k
            openssl pkeyutl -encrypt -pubin -inkey claude_pub.pem -in /tmp/peek.k -out /tmp/peek/peek.key.enc
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/peek.k -in "$STATE_FILE.peek" -out /tmp/peek/peek.enc
            rm -f /tmp/peek.k "$STATE_FILE.peek"
          fi

      - name: Быстрые ответы для приёмника (ветка snapshot, одна перезаписываемая версия)
        if: always()
        run: |
          if [ -f "$STATE_FILE.snap" ]; then
            export GIT_AUTHOR_NAME=solaris-monitor GIT_AUTHOR_EMAIL=monitor@users.noreply.github.com
            export GIT_COMMITTER_NAME=solaris-monitor GIT_COMMITTER_EMAIL=monitor@users.noreply.github.com
            blob=$(git hash-object -w "$STATE_FILE.snap")
            tree=$(printf "100644 blob %s\tsnapshot.enc\n" "$blob" | git mktree)
            commit=$(git commit-tree "$tree" -m snapshot)
            git push -q -f origin "$commit:refs/heads/snapshot" || echo "snapshot не записался"
          fi

      - name: Сохранить память в кэш
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/solaris-cache
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Сохранить память в репозиторий (только при важных изменениях)
        if: always()
        run: |
          if [ -f "$STATE_FILE.commit" ] && [ -f /tmp/solaris-cache/state.enc ]; then
            git config user.name "solaris-monitor"
            git config user.email "monitor@users.noreply.github.com"
            # Пока шла проверка, приёмник мог добавить новые команды. Поэтому каждый раз берём
            # свежую версию репозитория и накладываем на неё только свои изменения.
            for i in 1 2 3 4 5; do
              git fetch -q origin main
              git reset -q --hard origin/main
              cp /tmp/solaris-cache/state.enc state.enc
              git add state.enc
              # список полей Deye (без значений и данных станций) - чтобы настраивать код без доступа к Deye
              if [ -f "$STATE_FILE.fields" ]; then cp "$STATE_FILE.fields" deye_fields.json; git add deye_fields.json; fi
              if [ -f /tmp/peek/peek.enc ]; then mkdir -p claude_peek; cp /tmp/peek/peek.enc /tmp/peek/peek.key.enc claude_peek/; git add claude_peek; fi
              if [ -f "$STATE_FILE.inbox" ]; then
                while read -r f; do
                  if [ -n "$f" ] && [ -f "inbox/$f" ]; then git rm -q "inbox/$f"; fi
                done < "$STATE_FILE.inbox"
              fi
              git commit -q -m "state" || exit 0
              if git push -q origin HEAD:main; then exit 0; fi
              sleep 2
            done
            echo "память не записалась в репозиторий, но она сохранена в кэше"
          fi
