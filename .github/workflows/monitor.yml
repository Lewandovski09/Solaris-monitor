name: monitor

on:
  schedule:
    - cron: "3-59/5 * * * *"   # проверка каждые 5 минут (GitHub иногда задерживает на 5-15 минут)
    - cron: "17 7 1 * *"       # отчёт за прошлый месяц: 1-го числа, ~09:17 по Киеву
  workflow_dispatch:
    inputs:
      mode:
        description: "check - проверка, test - тест Telegram, diag - диагностика, report - отчёт"
        default: "check"
        type: choice
        options: [check, cmd, test, diag, report, webhook, webhook-off]

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DEYE_APP_ID: ${{ secrets.DEYE_APP_ID }}
      DEYE_APP_SECRET: ${{ secrets.DEYE_APP_SECRET }}
      DEYE_EMAIL: ${{ secrets.DEYE_EMAIL }}
      DEYE_PASSWORD: ${{ secrets.DEYE_PASSWORD }}
      DEYE_COMPANY_ID: ${{ secrets.DEYE_COMPANY_ID }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      STATIONS_JSON: ${{ secrets.STATIONS_JSON }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      INBOX_KEY: ${{ secrets.INBOX_KEY }}
      LOW_SOC: ${{ vars.LOW_SOC }}
      STALE_MIN: ${{ vars.STALE_MIN }}
      STATE_FILE: /tmp/solaris-state.json
    steps:
      - uses: actions/checkout@v4

      - name: Проверка секретов
        run: |
          for k in DEYE_APP_ID DEYE_APP_SECRET DEYE_EMAIL
